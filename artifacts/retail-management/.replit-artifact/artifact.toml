kind = "web"
previewPath = "/"
title = "Retail Management"
description = "A responsive retail management demo for Indian small businesses, covering point-of-sale billing, inventory, purchases, customers, expenses, staff, reports, and settings with local sample data and browser persistence."
version = "1.0.0"
id = "artifacts/retail-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18575

[services.development]
run = "pnpm --filter @workspace/retail-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/retail-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/retail-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18575"
BASE_PATH = "/"
